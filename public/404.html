      p { color: rgba(255,249,245,.72); line-height: 1.65; }
      strong { display: block; color: #f21b12; font-size: clamp(4rem, 16vw, 10rem); line-height: .9; }
      h1 { margin: 1rem 0; font-size: clamp(2.2rem, 7vw, 4.5rem); text-transform: uppercase; }
      a { display: inline-block; margin-top: 1rem; padding: 1rem 1.4rem; color: #fff9f5; background: #f21b12; font-weight: 700; text-decoration: none; }
    </style>
